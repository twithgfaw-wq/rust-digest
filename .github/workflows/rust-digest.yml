name: Rust Digest Bot

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      extra:
        description: "Доп. пост прямо сейчас"
        type: choice
        options: ["нет", "лучшее из воркшопа"]
        default: "нет"

permissions:
  contents: write

concurrency:
  group: rust-digest
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL: ${{ secrets.CHANNEL }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          WORKS_COUNT: ${{ vars.WORKS_COUNT }}
          MIN_SCORE: ${{ vars.MIN_SCORE }}
          REDDIT_PERIOD: ${{ vars.REDDIT_PERIOD }}
          POST_OFFICIAL_NEWS: ${{ vars.POST_OFFICIAL_NEWS }}
          YT_MAX_PER_DAY: ${{ vars.YT_MAX_PER_DAY }}
          EXTRA_POST: ${{ inputs.extra }}
        run: |
          pip install --quiet pillow
          python rust_digest_bot.py

      - name: Save posted history
        run: |
          if [ -n "$(git status --porcelain posted_state.json)" ]; then
            git config user.name "rust-digest-bot"
            git config user.email "bot@users.noreply.github.com"
            git add posted_state.json
            git commit -m "chore: update posted_state [skip ci]"
            git push
          else
            echo "Nothing to save."
          fi
