name: Manual Post

# 📣 Ручной пост из manual_post.json (например, анонс нового видео).
# Без галочки — только показать в логе.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Опубликовать в канал (без галочки — только тест)"
        type: boolean
        default: false

permissions:
  contents: write

# та же очередь, что у CS2-бота: оба пишут cs2_state.json
concurrency:
  group: cs2
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v4
        with:
          ref: main   # запуск из очереди берёт свежее состояние (иначе дубли)

      - name: Поставить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ручной пост
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          MANUAL_DRY: ${{ inputs.publish && '0' || '1' }}
        run: python manual_post.py

      - name: Сохранить состояние
        run: |
          if [ -n "$(git status --porcelain manual_post_sent.json cs2_state.json)" ]; then
            git config user.name "rust-digest-bot"
            git config user.email "bot@users.noreply.github.com"
            git add manual_post_sent.json cs2_state.json
            git commit -m "chore: update manual_post_sent [skip ci]"
            git pull --rebase
            git push
          fi
