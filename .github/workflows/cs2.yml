name: CS2 Digest

# Канал @cs2_me: официальные новости CS2 из Steam, посты @CounterStrike из X
# и онлайн. Бот тот же, что у Rust-канала (BOT_TOKEN). Расписание (каждые
# 30 минут) включим после того, как будут одобрены примеры постов.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Режим"
        type: choice
        options:
          - обычный
          - тест (ничего не отправлять)
          - примеры постов в лог
        default: обычный

permissions:
  contents: write

concurrency:
  group: cs2
  cancel-in-progress: false

jobs:
  cs2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v4

      - name: Поставить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: CS2-бот
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL: "@cs2_me"
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          CS2_DRY: ${{ inputs.mode == 'тест (ничего не отправлять)' && '1' || '' }}
          CS2_DEMO: ${{ inputs.mode == 'примеры постов в лог' && '1' || '' }}
        run: python cs2_bot.py

      - name: Сохранить состояние
        run: |
          if [ -n "$(git status --porcelain cs2_state.json)" ]; then
            git config user.name "rust-digest-bot"
            git config user.email "bot@users.noreply.github.com"
            git add cs2_state.json
            git commit -m "chore: update cs2_state [skip ci]"
            git pull --rebase
            git push
          fi
