name: CS2 Digest

# Канал @cs2_me: официальные новости CS2 из Steam, посты @CounterStrike из X
# и онлайн. Каждые 30 минут; бот тот же, что у Rust-канала (BOT_TOKEN).
on:
  schedule:
    - cron: "12,42 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Режим"
        type: choice
        options:
          - обычный
          - тест (ничего не отправлять)
          - примеры постов в лог
          - сводка цен сейчас
          - пример инвест-разбора
          - пример мастерской
          - пример сообщества
          - запуск — по одному посту каждой рубрики
        default: обычный

permissions:
  contents: write

concurrency:
  group: cs2
  cancel-in-progress: false

jobs:
  cs2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v4

      - name: Поставить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: CS2-бот
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL: "@cs2_me"
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CS2_DRY: ${{ inputs.mode == 'тест (ничего не отправлять)' && '1' || '' }}
          CS2_DEMO: ${{ inputs.mode == 'примеры постов в лог' && '1' || '' }}
          CS2_PRICES: ${{ inputs.mode == 'сводка цен сейчас' && '1' || '' }}
          CS2_DEMO_INVEST: ${{ inputs.mode == 'пример инвест-разбора' && '1' || '' }}
          CS2_DEMO_WORKSHOP: ${{ inputs.mode == 'пример мастерской' && '1' || '' }}
          CS2_DEMO_COMMUNITY: ${{ inputs.mode == 'пример сообщества' && '1' || '' }}
          CS2_LAUNCH: ${{ inputs.mode == 'запуск — по одному посту каждой рубрики' && '1' || '' }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: |
          pip install --quiet pillow brotli anthropic
          python cs2_bot.py

      - name: Сохранить состояние
        run: |
          if [ -n "$(git status --porcelain cs2_state.json)" ]; then
            git config user.name "rust-digest-bot"
            git config user.email "bot@users.noreply.github.com"
            git add cs2_state.json
            git commit -m "chore: update cs2_state [skip ci]"
            git pull --rebase
            git push
          fi
