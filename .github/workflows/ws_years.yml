name: WS Years

# Разовый отчёт для сюжета о мастерской CS (28.10.2026): работы по годам у
# авторов с принятыми работами. Официальный Steam API, один запуск, ничего не
# публикует. Временный — удалить после сбора.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Отчёт
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: python ws_years.py
