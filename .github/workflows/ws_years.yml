name: WS Years

# Разовый отчёт для сюжета о мастерской CS (28.10.2026): работы по годам у
# авторов с принятыми работами. Официальный Steam API, один запуск, ничего не
# публикует. Временный — удалить после сбора.
on:
  workflow_dispatch:
    inputs:
      authors:
        description: "SteamID авторов с принятыми работами (через запятую)"
        required: false
        default: ""
      veterans:
        description: "SteamID ветеранов CS:GO (через запятую)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Отчёт
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          AUTHORS: ${{ inputs.authors }}
          VETERANS: ${{ inputs.veterans }}
        run: python ws_years.py
