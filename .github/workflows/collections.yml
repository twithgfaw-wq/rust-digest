name: Rust Collections

# 📚 «Лучшие коллекции Rust для покупки» — разбор по истории недельных
# скинов. Запуск вручную; по умолчанию тест (только лог и картинка).
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Опубликовать в канал (без галочки — только тест)"
        type: boolean
        default: false

concurrency:
  group: collections
  cancel-in-progress: false

jobs:
  collections:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v4

      - name: Поставить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Разбор коллекций
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL: ${{ secrets.CHANNEL }}
          COLL_DRY: ${{ inputs.publish && '0' || '1' }}
        run: |
          pip install --quiet pillow
          python rust_collections.py
