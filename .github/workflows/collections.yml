name: Rust Collections

# 📚 «Лучшие коллекции Rust для покупки» — разбор по истории недельных
# скинов. Сам — раз в месяц, в первый вторник (cron срабатывает каждый
# вторник, скрипт пропускает остальные). Вручную по умолчанию тест.
on:
  schedule:
    - cron: "0 14 * * 2"   # вторник 14:00 UTC = 16–17:00 по Киеву
  workflow_dispatch:
    inputs:
      publish:
        description: "Опубликовать в канал (без галочки — только тест)"
        type: boolean
        default: false

concurrency:
  group: collections
  cancel-in-progress: false

jobs:
  collections:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v4

      - name: Поставить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Разбор коллекций
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL: ${{ secrets.CHANNEL }}
          COLL_DRY: ${{ (github.event_name == 'schedule' || inputs.publish) && '0' || '1' }}
          COLL_MONTHLY: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: |
          pip install --quiet pillow
          python rust_collections.py
