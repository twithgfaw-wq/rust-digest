name: Market Index

# 📈 Индекс рынка CS2 по маркету Steam — считаем заранее (~3 мин: 60 страниц
# маркета), чтобы в 10:00 по Киеву CS2-бот выложил пост сразу и не задерживал
# новости. Если не вышло — бот посчитает сам.
on:
  schedule:
    - cron: "20 6 * * *"   # 09:20 по Киеву летом (08:20 зимой)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v4

      - name: Поставить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Индекс по маркету Steam
        run: python market_index.py precompute

      - name: Сохранить
        run: |
          if [ -n "$(git status --porcelain cs2_index_steam.json)" ]; then
            git config user.name "rust-digest-bot"
            git config user.email "bot@users.noreply.github.com"
            git add cs2_index_steam.json
            git commit -m "chore: update cs2_index_steam [skip ci]"
            git pull --rebase
            git push
          fi
