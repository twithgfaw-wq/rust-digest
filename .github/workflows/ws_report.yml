name: WS Report

# Разовый отчёт по мастерской CS для сюжета (28.10.2026): соавторы принятых
# работ и активность авторов. Только ручной запуск, ничего не публикует.
# Временный — удалить после сбора.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        n: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Часть отчёта
        run: python ws_report.py shard ${{ matrix.n }} 8
      - uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.n }}
          path: report_${{ matrix.n }}.json

  merge:
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: parts
      - name: Сводка
        run: python ws_report.py merge parts
