name: Workshop Authors

# Отчёт в лог: свежие скины мастерской CS2 по числу принятых работ автора.
on:
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v4

      - name: Поставить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Отчёт
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: python ws_authors.py
